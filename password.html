<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg">
  <title>Four Circles — Enter Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Public+Sans:wght@400;600&family=Inter:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="password.css">
</head>
<body>
  <div class="password-page">
    <div class="password-left">
      <div class="password-content">
        <img src="assets/lock-icon.svg" alt="" class="password-lock">
        <h1 class="password-heading">Inside Four Circles<span class="dot-purple">.</span></h1>
        <p class="password-desc">Our new site is in the works. Email us at <a href="mailto:hello@byfourcircles.com" class="password-email">hello@byfourcircles.com</a> if you have a project in mind.</p>
        <form class="password-form" onsubmit="return handlePassword(event)">
          <input type="password" class="password-input" placeholder="Enter password" autocomplete="off">
          <button type="submit" class="password-btn">
            <span>Submit</span>
            <img src="assets/arrow-icon.svg" alt="" class="btn-arrow">
          </button>
        </form>
        <p class="password-error" id="passwordError">Incorrect password. Please try again.</p>
      </div>
    </div>
    <div class="password-right">
      <div class="password-logo">
        <img src="assets/logo-icon-large.svg" alt="Four Circles" class="password-logo-icon">
        <img src="assets/logo-text-white.svg" alt="FOUR CIRCLES" class="password-logo-text">
      </div>
    </div>
  </div>

  <script>
    function handlePassword(e) {
      e.preventDefault();
      var input = document.querySelector('.password-input');
      if (input.value === 'MelRyanIan') {
        sessionStorage.setItem('fc-auth', 'true');
        window.location.href = 'index.html';
      } else {
        document.getElementById('passwordError').classList.add('visible');
        input.value = '';
        input.focus();
      }
      return false;
    }
  </script>
</body>
</html>
